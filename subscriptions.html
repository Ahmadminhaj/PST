<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b45f5">
<title>PSD My Work - Subscriptions</title>
<link rel="stylesheet" href="subscriptions.css">
</head>
<body>
<div class="app">
<header class="header">
<a class="back-btn" href="index.html">←</a>
<div class="header-title"><h1>Subscriptions</h1><p>PSD My Work</p></div>
<a class="settings-btn" href="settings.html">⚙</a>
</header>

<main>
<section class="intro">
<span>MANAGE</span>
<h2>My Subscriptions</h2>
<p>Track your active plans, payments and renewal dates.</p>
</section>

<div class="filter-row">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="active">Active</button>
<button class="filter" data-filter="due">Due Soon</button>
</div>

<section id="subscriptionList" class="subscription-list"></section>

<div id="emptyState" class="empty">
<div>📋</div>
<strong>No subscriptions found</strong>
<p>Add a subscription to start tracking your payments.</p>
</div>
</main>

<button id="addBtn" class="floating">+</button>

<nav class="bottom-nav">
<a href="index.html">⌂<small>Home</small></a>
<a href="dashboard.html">▣<small>Dashboard</small></a>
<a href="subscriptions.html" class="active">☷<small>Subscriptions</small></a>
<a href="analytics.html">◔<small>Analytics</small></a>
<a href="settings.html">⚙<small>Settings</small></a>
</nav>

<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-head"><h3>Add Subscription</h3><button id="closeBtn" type="button">×</button></div>
<label>Subscription Name<input id="name" type="text" placeholder="e.g. Netflix"></label>
<label>Amount<input id="amount" type="number" min="0" step="0.01" placeholder="0"></label>
<label>Billing Cycle<select id="cycle"><option value="Monthly">Monthly</option><option value="Yearly">Yearly</option></select></label>
<label>Next Payment<input id="date" type="date"></label>
<label>Category<select id="category"><option>Entertainment</option><option>Software</option><option>Education</option><option>Cloud</option><option>Other</option></select></label>
<button id="saveBtn" class="save-btn" type="button">Add Subscription</button>
</div>
</div>
<div id="toast" class="toast"></div>
</div>
<script src="subscriptions.js"></script>
</body>
</html>
